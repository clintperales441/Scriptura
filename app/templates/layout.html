<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scriptura{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand">📝 Scriptura</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/practice/setup">Practice</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>Scriptura — Write. Review. Understand. Rewrite. Track.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
